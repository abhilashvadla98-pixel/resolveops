name: resolveops

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resolveops
      POSTGRES_USER: resolveops
      POSTGRES_PASSWORD: ${RESOLVEOPS_POSTGRES_PASSWORD:?Set RESOLVEOPS_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveops -d resolveops"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - resolveops-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      args:
        REVISION: ${RESOLVEOPS_IMAGE_REVISION:-local}
    image: resolveops:${RESOLVEOPS_IMAGE_TAG:-local}
    command: ["alembic", "upgrade", "head"]
    environment: &app-environment
      RESOLVEOPS_ENVIRONMENT: development
      RESOLVEOPS_DATABASE_URL: postgresql+psycopg://resolveops:${RESOLVEOPS_POSTGRES_PASSWORD}@database:5432/resolveops
      RESOLVEOPS_DEFAULT_TENANT_ID: TENANT-LOCAL
      RESOLVEOPS_API_KEY_IDENTITIES_JSON: ${RESOLVEOPS_API_KEY_IDENTITIES_JSON:-[]}
      RESOLVEOPS_WEBHOOK_SECRET: ${RESOLVEOPS_WEBHOOK_SECRET:-local-development-webhook-secret-change-me}
      RESOLVEOPS_GEMINI_API_KEY: ${RESOLVEOPS_GEMINI_API_KEY:-}
      RESOLVEOPS_GEMINI_MODEL: ${RESOLVEOPS_GEMINI_MODEL:-gemini-3.5-flash-lite}
      RESOLVEOPS_MAX_REQUEST_BODY_BYTES: ${RESOLVEOPS_MAX_REQUEST_BODY_BYTES:-1048576}
      RESOLVEOPS_RATE_LIMIT_REQUESTS: ${RESOLVEOPS_RATE_LIMIT_REQUESTS:-120}
      RESOLVEOPS_RATE_LIMIT_PERIOD_SECONDS: ${RESOLVEOPS_RATE_LIMIT_PERIOD_SECONDS:-60}
      RESOLVEOPS_RATE_LIMIT_MAX_BUCKETS: ${RESOLVEOPS_RATE_LIMIT_MAX_BUCKETS:-10000}
      RESOLVEOPS_RATE_LIMIT_IDLE_TTL_SECONDS: ${RESOLVEOPS_RATE_LIMIT_IDLE_TTL_SECONDS:-900}
      RESOLVEOPS_REDIS_URL: ${RESOLVEOPS_REDIS_URL:-}
      RESOLVEOPS_AGENT_QUEUE_ENABLED: ${RESOLVEOPS_AGENT_QUEUE_ENABLED:-false}
      RESOLVEOPS_AGENT_QUEUE_CAPACITY: ${RESOLVEOPS_AGENT_QUEUE_CAPACITY:-500}
      RESOLVEOPS_AGENT_JOB_LEASE_SECONDS: ${RESOLVEOPS_AGENT_JOB_LEASE_SECONDS:-120}
      RESOLVEOPS_AGENT_JOB_MAX_ATTEMPTS: ${RESOLVEOPS_AGENT_JOB_MAX_ATTEMPTS:-2}
      RESOLVEOPS_AGENT_WORKER_POLL_SECONDS: ${RESOLVEOPS_AGENT_WORKER_POLL_SECONDS:-5}
      RESOLVEOPS_DEMO_ENABLED: ${RESOLVEOPS_DEMO_ENABLED:-true}
      RESOLVEOPS_DEMO_TENANT_ID: ${RESOLVEOPS_DEMO_TENANT_ID:-TENANT-LOCAL}
      RESOLVEOPS_DEMO_SESSION_SECRET: ${RESOLVEOPS_DEMO_SESSION_SECRET:-local-demo-session-secret-at-least-32-chars}
      RESOLVEOPS_DEMO_SESSION_TTL_SECONDS: ${RESOLVEOPS_DEMO_SESSION_TTL_SECONDS:-1800}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    image: resolveops:${RESOLVEOPS_IMAGE_TAG:-local}
    environment: *app-environment
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${RESOLVEOPS_API_PORT:-8000}:8000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  seed:
    image: resolveops:${RESOLVEOPS_IMAGE_TAG:-local}
    command: ["python", "-m", "resolveops.database.seed"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["demo"]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  redis:
    image: redis:7-alpine
    user: redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    profiles: ["worker"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker:
    image: resolveops:${RESOLVEOPS_IMAGE_TAG:-local}
    command: ["resolveops-worker"]
    environment:
      <<: *app-environment
      RESOLVEOPS_REDIS_URL: redis://redis:6379/0
      RESOLVEOPS_AGENT_QUEUE_ENABLED: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    profiles: ["worker"]
    init: true
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  resolveops-postgres:
