services:
  - type: web
    name: resolveops-demo
    runtime: docker
    plan: free
    region: ohio
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: >-
      /bin/sh -c "alembic upgrade head && python -m resolveops.database.seed &&
      exec uvicorn resolveops.api.main:app --host 0.0.0.0 --port ${PORT:-10000}"
    healthCheckPath: /health/ready
    envVars:
      - key: RESOLVEOPS_ENVIRONMENT
        value: demo
      - key: RESOLVEOPS_DATABASE_URL
        fromDatabase:
          name: resolveops-demo-db
          property: connectionString
      - key: RESOLVEOPS_DEFAULT_TENANT_ID
        value: TENANT-DEMO
      - key: RESOLVEOPS_API_KEY_IDENTITIES_JSON
        value: "[]"
      - key: RESOLVEOPS_WEBHOOK_SECRET
        generateValue: true
      - key: RESOLVEOPS_DEMO_ENABLED
        value: "true"
      - key: RESOLVEOPS_DEMO_TENANT_ID
        value: TENANT-DEMO
      - key: RESOLVEOPS_DEMO_SESSION_SECRET
        generateValue: true
      - key: RESOLVEOPS_DEMO_SESSION_TTL_SECONDS
        value: "1800"
      - key: RESOLVEOPS_INTEGRATED_AGENTS_ENABLED
        value: "false"
      - key: RESOLVEOPS_GEMINI_KEY_ROTATED
        value: "false"
      - key: RESOLVEOPS_AGENT_QUEUE_ENABLED
        value: "false"
      - key: RESOLVEOPS_RATE_LIMIT_REQUESTS
        value: "60"
      - key: RESOLVEOPS_RATE_LIMIT_PERIOD_SECONDS
        value: "60"
      - key: RESOLVEOPS_MAX_REQUEST_BODY_BYTES
        value: "1048576"
      - key: RESOLVEOPS_OTLP_SERVICE_NAME
        value: resolveops-public-demo

databases:
  - name: resolveops-demo-db
    plan: free
    region: ohio
    postgresMajorVersion: "16"
    databaseName: resolveops_demo
    user: resolveops_demo
    ipAllowList: []
