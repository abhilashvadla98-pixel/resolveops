name: CI

on:
  pull_request:
  push:
    branches: [main, codex-build]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==0.12.20"
      - run: uv sync --locked --extra dev --extra interfaces --extra llm --extra observability --extra workflow --extra worker
      - run: uv run ruff check .
      - run: uv run ruff format --check src tests migrations scripts
      - run: uv run mypy
      - run: uv run pytest -m "not postgres and not browser" -q
      - run: uv run python -m resolveops.evaluation.run
      - run: uv run python -m resolveops.evaluation.run_employee
      - run: uv run python scripts/run_agent_evaluation.py --output evals/agents/ci-report.json
      - run: uv run python -m pip check

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==0.12.20"
      - run: uv sync --locked --extra dev --extra interfaces --extra llm --extra workflow --extra worker
      - run: uv run python scripts/security_check.py
      - run: uv run python scripts/run_security_evaluation.py
      - run: uv run python -m bandit -r src -q -ll
      - run: uv run python -m pip_audit --local --skip-editable

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resolveops
          POSTGRES_PASSWORD: integration-test-password
          POSTGRES_DB: resolveops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resolveops -d resolveops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RESOLVEOPS_TEST_DATABASE_URL: postgresql+psycopg://resolveops:integration-test-password@localhost:5432/resolveops_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==0.12.20"
      - run: uv sync --locked --extra dev --extra interfaces --extra llm --extra workflow
      - run: uv run pytest -m postgres -q

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==0.12.20"
      - run: uv sync --locked --extra dev --extra interfaces --extra llm --extra workflow
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m browser -q

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RESOLVEOPS_POSTGRES_PASSWORD: compose-integration-password
      RESOLVEOPS_API_KEY_IDENTITIES_JSON: "[]"
      RESOLVEOPS_WEBHOOK_SECRET: compose-integration-webhook-secret-123456
      RESOLVEOPS_IMAGE_TAG: ci
      RESOLVEOPS_API_PORT: "18080"
      RESOLVEOPS_AGENT_QUEUE_ENABLED: "true"
      RESOLVEOPS_REDIS_URL: redis://redis:6379/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: docker compose --profile worker config --quiet
      - run: docker compose --profile worker up --build -d database redis migrate api worker
      - run: python scripts/verify_deployment.py --base-url http://127.0.0.1:18080 --attempts 30 --delay-seconds 2
      - run: docker compose --profile worker exec -T redis redis-cli ping | grep -qx PONG
      - run: docker compose --profile worker ps --status running --services | grep -qx worker
      - if: always()
        run: docker compose --profile worker logs --no-color
      - if: always()
        run: docker compose --profile worker down --volumes --remove-orphans

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.5"
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - run: terraform init -backend=false
        working-directory: infra/terraform
      - run: terraform validate
        working-directory: infra/terraform
