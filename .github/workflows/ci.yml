name: CI

on:
  pull_request:
  push:
    branches: [main, codex-build]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,interfaces,llm,workflow]"
      - run: ruff check .
      - run: ruff format --check src tests migrations scripts
      - run: mypy
      - run: pytest -m "not postgres" -q
      - run: python -m resolveops.evaluation.run
      - run: python -m resolveops.evaluation.run_employee
      - run: python -m pip check

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade "pip>=26.2,<27"
      - run: python -m pip install -e ".[dev,interfaces,llm,workflow]"
      - run: python scripts/security_check.py
      - run: python -m bandit -r src -q -ll
      - run: python -m pip_audit --local --skip-editable

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resolveops
          POSTGRES_PASSWORD: integration-test-password
          POSTGRES_DB: resolveops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resolveops -d resolveops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RESOLVEOPS_TEST_DATABASE_URL: postgresql+psycopg://resolveops:integration-test-password@localhost:5432/resolveops_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,interfaces,llm,workflow]"
      - run: pytest -m postgres -q

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RESOLVEOPS_POSTGRES_PASSWORD: compose-integration-password
      RESOLVEOPS_API_KEY_IDENTITIES_JSON: "[]"
      RESOLVEOPS_WEBHOOK_SECRET: compose-integration-webhook-secret-123456
      RESOLVEOPS_IMAGE_TAG: ci
      RESOLVEOPS_API_PORT: "18080"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: docker compose config --quiet
      - run: docker compose up --build -d database migrate api
      - run: python scripts/verify_deployment.py --base-url http://127.0.0.1:18080 --attempts 30 --delay-seconds 2
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes --remove-orphans

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.10.5"
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - run: terraform init -backend=false
        working-directory: infra/terraform
      - run: terraform validate
        working-directory: infra/terraform
